[package]
name = "emping"
version = "0.2.2"
edition = "2021"
rust-version = "1.88"
description = "Passively watch ICMP echo requests sent to this host and whether it replies"
license = "MIT"
keywords = ["icmp", "ping", "network", "monitor"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
pnet = "0.35"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
